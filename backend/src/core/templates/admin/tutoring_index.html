{% extends "admin/index.html" %}

{% block content %}
<div class="module">
    <h2>Công cụ quản trị</h2>
    <div class="tool-card-list">
        {% for link in nav_links %}
        <div class="tool-card">
            <h3><a href="{{ link.url }}">{{ link.label }}</a></h3>
            <p>{{ link.description }}</p>
            <a class="button" href="{{ link.url }}">Mở trang</a>
        </div>
        {% endfor %}
    </div>
</div>

{{ block.super }}
{% endblock %}
